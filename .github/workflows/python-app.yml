name: Python application test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps chromium
        
    - name: Run backend tests
      run: |
        pytest

  e2e-login:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Prepare test log directory
      run: |
        mkdir -p test_log

    - name: Run E2E login tests (run 1)
      run: |
        pytest -m e2e -k "login" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-login-1.xml

    - name: Run E2E login tests (run 2)
      run: |
        pytest -m e2e -k "login" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-login-2.xml

    - name: Upload E2E login reports
      uses: actions/upload-artifact@v4
      with:
        name: e2e-login-reports
        path: test_log/e2e-login-*.xml

  e2e-forum:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Prepare test log directory
      run: |
        mkdir -p test_log

    - name: Run E2E forum tests (run 1)
      run: |
        pytest -m e2e -k "forum or create_forum_post" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-forum-1.xml

    - name: Run E2E forum tests (run 2)
      run: |
        pytest -m e2e -k "forum or create_forum_post" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-forum-2.xml

    - name: Upload E2E forum reports
      uses: actions/upload-artifact@v4
      with:
        name: e2e-forum-reports
        path: test_log/e2e-forum-*.xml

  e2e-learning:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Prepare test log directory
      run: |
        mkdir -p test_log

    - name: Run E2E learning tests (run 1)
      run: |
        pytest -m e2e -k "listening or vocabulary" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-learning-1.xml

    - name: Run E2E learning tests (run 2)
      run: |
        pytest -m e2e -k "listening or vocabulary" -o addopts= --capture=tee-sys --junitxml=test_log/e2e-learning-2.xml

    - name: Upload E2E learning reports
      uses: actions/upload-artifact@v4
      with:
        name: e2e-learning-reports
        path: test_log/e2e-learning-*.xml
